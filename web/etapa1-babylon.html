<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etapa 1 · Escena híbrida con Babylon.js</title>
<style>
body{margin:0;background:#12141c;color:#e9ebf5;font:14px system-ui,Segoe UI,sans-serif;padding:16px;max-width:1280px;margin:auto}
h1{color:#ffb347;font-size:21px;margin:0 0 2px}p.s{opacity:.75;margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
button,select{background:#2a2f45;color:#fff;border:0;border-radius:9px;padding:9px 13px;font:inherit;cursor:pointer}button.pri{background:#7a5cff;font-weight:700}button:disabled{opacity:.45}
label{background:#1b1e2c;border:1px solid #343a58;border-radius:9px;padding:7px 10px;cursor:pointer;user-select:none}
.vista{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.vista canvas{width:100%;height:100%;display:block}
#hud{position:absolute;left:10px;top:10px;background:#000b;padding:6px 10px;border-radius:9px;font-size:12px;pointer-events:none}
pre{background:#1b1e2c;border:1px solid #343a58;border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-word}
h2{color:#ffb347;font-size:15px;margin:18px 0 6px}video{max-width:100%;border-radius:10px;margin-top:8px}
</style></head><body>
<h1>🧪 Etapa 1 · Escena híbrida con Babylon.js</h1>
<p class="s">Fondo 2,5D con paralaje (capas de tu programa) + decoración 2D + un personaje 3D, con luz, sombra, bloom, desenfoque de profundidad y partículas en GPU. Es solo una prueba: no toca tu programa.</p>
<div class="bar">
 <select id="motor"><option value="webgpu">Motor: WebGPU</option><option value="webgl2">Motor: WebGL2</option></select>
 <button id="reiniciar">Cambiar motor</button>
 <button id="pausa">⏸ Pausar</button>
 <button id="medir" class="pri">⏱ Medir sin tope</button>
 <button id="exp" class="pri">🎞 Exportar 5 s a MP4</button>
 <button id="cmp">Ver como hoy (Canvas 2D)</button>
 <button id="cp">📋 Copiar informe</button>
</div>
<div class="bar" id="efs"></div>
<div class="vista"><canvas id="cv"></canvas><canvas id="cv2d" style="display:none;position:absolute;inset:0"></canvas><div id="hud">iniciando…</div></div>
<h2>Informe</h2><pre id="out">Cargando…</pre>
<div id="vid"></div>
<script src="js/serie_art.js"></script>
<script src="vendor/mp4-muxer.js"></script>
<script src="vendor/babylon-etapa1.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id),L=[],out=$("out");
const log=s=>{L.push(s);out.textContent=L.join("\n");};
const q=new URLSearchParams(location.search);let motor=q.get("motor")||"webgpu";$("motor").value=motor;
let E=null,pausado=false,rafId=0,t0=performance.now(),tPausa=0,frames=0,tFps=performance.now(),fps=0;
const nombres={bloom:"Bloom",dof:"Desenfoque de profundidad",vineta:"Viñeta",grano:"Grano",msaa:"Suavizado 4x",sombra:"Sombra suave",particulas:"Luciérnagas (GPU)",tono:"Tono cine"};
async function arrancar(){
  $("hud").textContent="iniciando "+motor+"…";
  try{E=await Etapa1.iniciar($("cv"),{motor,fondo:"pradera",apagar:q.get("min")==="1"});}
  catch(e){log("✖ No pude iniciar "+motor+": "+e.message);if(motor==="webgpu"){motor="webgl2";$("motor").value=motor;log("→ Pruebo con WebGL2…");E=await Etapa1.iniciar($("cv"),{motor});}else return;}
  log("Motor en uso: "+E.motor+" · partículas: "+E.tipoPart+" · "+E.W+"×"+E.H);
  const ef=$("efs");ef.innerHTML="";
  for(const k of Object.keys(nombres)){const l=document.createElement("label"),c=document.createElement("input");c.type="checkbox";c.checked=E.ef[k];c.onchange=()=>{E.ef[k]=c.checked;E.aplicar();};l.append(c," "+nombres[k]);ef.appendChild(l);}
  bucle();
}
function bucle(){
  rafId=requestAnimationFrame(bucle);
  if(pausado||!E)return;
  const t=(performance.now()-t0)/1000;E.poner(t);E.scene.render();
  frames++;const a=performance.now();if(a-tFps>500){fps=frames*1000/(a-tFps);frames=0;tFps=a;$("hud").textContent=E.motor.toUpperCase()+" · "+fps.toFixed(0)+" cuadros/s";}
}
$("pausa").onclick=()=>{pausado=!pausado;$("pausa").textContent=pausado?"▶ Seguir":"⏸ Pausar";if(!pausado)t0=performance.now();};
$("reiniciar").onclick=()=>{location.search="?motor="+$("motor").value;};
async function gpuListo(){const d=E.engine._device;if(d&&d.queue)await d.queue.onSubmittedWorkDone();else{const gl=E.engine._gl;if(gl){gl.finish();gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(4));}}}
$("medir").onclick=async()=>{
  $("medir").disabled=true;pausado=true;
  const casos=[["Todo activado",{}],["Sin efectos (solo dibujo)",{bloom:false,dof:false,vineta:false,grano:false,msaa:false,sombra:true,particulas:true,tono:false}],["Sin sombra ni partículas",{sombra:false,particulas:false}]];
  const base={...E.ef};
  for(const [n,ov] of casos){
    Object.assign(E.ef,base,ov);E.aplicar();await new Promise(r=>setTimeout(r,200));
    for(let i=0;i<20;i++){E.poner(i/30);E.scene.render();}await gpuListo();
    const N=240,a=performance.now();for(let i=0;i<N;i++){E.poner(i/30);E.scene.render();if(i%30===29)await gpuListo();}await gpuListo();
    const dt=(performance.now()-a)/N;log("Medición · "+n+": "+(1000/dt).toFixed(0)+" cuadros/s ("+dt.toFixed(2)+" ms por cuadro)");
  }
  Object.assign(E.ef,base);E.aplicar();pausado=false;t0=performance.now();$("medir").disabled=false;
};
$("exp").onclick=async()=>{
  if(typeof VideoEncoder==="undefined"||typeof Mp4Muxer==="undefined"){log("✖ Este navegador no puede crear MP4.");return;}
  $("exp").disabled=true;pausado=true;const fpsV=30,seg=5,total=fpsV*seg,Wv=1920,Hv=1080;
  let cfg=null,gpu=false;
  for(const hw of ["prefer-hardware","prefer-software"]){const c={codec:"avc1.640028",width:Wv,height:Hv,bitrate:14e6,framerate:fpsV,avc:{format:"avc"},hardwareAcceleration:hw};try{const r=await VideoEncoder.isConfigSupported(c);if(r.supported){cfg=c;gpu=hw==="prefer-hardware";break;}}catch(e){}}
  if(!cfg){log("✖ No hay codificador H.264.");$("exp").disabled=false;pausado=false;return;}
  const mux=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:"avc",width:Wv,height:Hv},fastStart:"in-memory"});
  let err=null;const enc=new VideoEncoder({output:(c,m)=>mux.addVideoChunk(c,m),error:e=>{err=e;}});enc.configure(cfg);
  const sa=E.scene.getAnimationRatio;E.scene.getAnimationRatio=()=>60/fpsV;
  const a=performance.now();let modo="VideoFrame directo del lienzo",tmp=null,tg=null;
  for(let i=0;i<total&&!err;i++){
    await new Promise(r=>requestAnimationFrame(r));
    E.poner(i/fpsV);E.scene.render();
    let f;try{if(modo.startsWith("VideoFrame"))f=new VideoFrame($("cv"),{timestamp:Math.round(i*1e6/fpsV),duration:Math.round(1e6/fpsV)});}catch(e){modo="copia por Canvas 2D";}
    if(!f){if(!tmp){tmp=document.createElement("canvas");tmp.width=Wv;tmp.height=Hv;tg=tmp.getContext("2d");}tg.drawImage($("cv"),0,0);f=new VideoFrame(tmp,{timestamp:Math.round(i*1e6/fpsV),duration:Math.round(1e6/fpsV)});}
    while(enc.encodeQueueSize>6)await new Promise(r=>setTimeout(r,2));
    enc.encode(f,{keyFrame:i%60===0});f.close();
    if(i%15===0)$("hud").textContent="Exportando… "+Math.round(i/total*100)+"%";
  }
  E.scene.getAnimationRatio=sa;
  try{await enc.flush();enc.close();if(err)throw err;mux.finalize();
    const blob=new Blob([mux.target.buffer],{type:"video/mp4"}),url=URL.createObjectURL(blob),s=(performance.now()-a)/1000;
    log("✔ MP4 listo: "+Wv+"×"+Hv+" · "+fpsV+" cuadros/s · "+seg+" s · "+(blob.size/1048576).toFixed(1)+" MB · "+(gpu?"codificado con GPU":"codificado con CPU")+" · "+modo+" · tardó "+s.toFixed(1)+" s ("+(total/s).toFixed(0)+" cuadros/s)");
    $("vid").innerHTML='<video controls src="'+url+'"></video><p><a style="color:#ffb347" download="etapa1-babylon.mp4" href="'+url+'">⬇ Descargar MP4</a></p>';
  }catch(e){log("✖ No se pudo terminar el MP4: "+(e&&e.message||e));}
  pausado=false;t0=performance.now();$("exp").disabled=false;$("hud").textContent="";
};
/* comparación: el mismo fondo y decoración como los dibuja hoy el programa (Canvas 2D) */
$("cmp").onclick=()=>{
  const c=$("cv2d");if(c.style.display!=="none"){c.style.display="none";$("cmp").textContent="Ver como hoy (Canvas 2D)";return;}
  c.width=1920;c.height=1080;const g=c.getContext("2d"),A=SerieArt,bg=A.BG.find(b=>b.id==="pradera");
  A.dibujarFondo(g,bg,1.5,1.5,1,1.5,{x:0,y:0},undefined,1280);
  for(const [id,x,y,s] of [["arbol",170,650,1.1],["arbusto",390,640,1],["flores",790,640,1],["arbusto",1060,640,1.2],["arbol",1160,650,1]]){const sp=A.SP.find(z=>z.id===id),k=A.sprite(sp,1.5);g.drawImage(k.cv,(x-k.ax*s)*1.5,(y-k.ay*s)*1.5,k.wU*s*1.5,k.hU*s*1.5);}
  g.fillStyle="#000a";g.fillRect(20,1030,520,36);g.fillStyle="#fff";g.font="22px system-ui";g.fillText("Así se dibuja hoy (Canvas 2D, sin personaje)",32,1056);
  c.style.display="block";$("cmp").textContent="Volver a Babylon";
};
$("cp").onclick=async()=>{try{await navigator.clipboard.writeText(L.join("\n"));$("cp").textContent="✔ Copiado";}catch(e){$("cp").textContent="Selecciona el informe y copia";}};
(async()=>{
  log("Navegador: "+navigator.userAgent);
  try{await arrancar();}catch(e){log("✖ Error: "+e.message);console.error(e);}
})();
</script></body></html>
