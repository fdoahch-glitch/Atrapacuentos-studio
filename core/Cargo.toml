[package]
name = "atrapa-core"
version = "1.1.0"
edition = "2021"

[dependencies]
wgpu = "*"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std"] }
ureq = { version = "2", features = ["tls"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std", "directml"] }
