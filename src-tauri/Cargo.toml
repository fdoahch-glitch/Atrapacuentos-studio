[package]
name = "atrapacuentos-studio"
version = "1.2.0"
edition = "2021"
description = "AtrapaCuentos Studio Master: crea cuentos animados y expórtalos a MP4 con la tarjeta de video"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atrapa-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
