# Compila el programa nativo (Rust + Tauri) y crea el instalador de Windows (.exe) y los de Linux.
# Los instaladores quedan en la pestaña «Actions» → la ejecución → «Artifacts».
name: Construir instaladores
on:
  push:
    branches: [main, mejoras-estudio]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    env:
      WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bajar FFmpeg y ONNX Runtime (DirectML)
        shell: pwsh
        run: ./scripts/bajar-binarios.ps1
      - name: Comprobar que el modelo de relieve existe en internet
        shell: pwsh
        run: |
          $ok = $false
          foreach ($u in "https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model.onnx") {
            try { $r = Invoke-WebRequest -Uri $u -Method Head -UseBasicParsing; Write-Host "$u -> $($r.StatusCode) $($r.Headers['Content-Length'])"; $ok = $true } catch { Write-Host "$u -> $($_.Exception.Message)" }
          }
          if (-not $ok) { throw "No se encontró el modelo de relieve" }
      - name: Pruebas del núcleo (GPU wgpu, FFmpeg, relieve)
        shell: pwsh
        run: |
          python -m pip install -q onnx numpy
          python scripts/modelo_prueba.py "$env:RUNNER_TEMP\prueba.onnx"
          $env:ATRAPA_FFMPEG = (Resolve-Path src-tauri\bin\ffmpeg.exe).Path
          $env:ATRAPA_ORT_LIB = (Resolve-Path src-tauri\bin\onnxruntime.dll).Path
          $env:ATRAPA_MODELO_PRUEBA = "$env:RUNNER_TEMP\prueba.onnx"
          $env:PATH = "$((Resolve-Path src-tauri\bin).Path);$env:PATH"
          cargo test -p atrapa-core -- --nocapture
      - name: Instalador
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      # Firma digital OPCIONAL: solo corre si en GitHub → Settings → Secrets existen WIN_CERT_BASE64 y WIN_CERT_PASSWORD.
      # Sin certificado no pasa nada: el instalador sale igual, sin firmar (Windows puede mostrar el aviso de SmartScreen).
      - name: Firmar instalador (solo si hay certificado)
        if: ${{ env.WIN_CERT_BASE64 != '' }}
        shell: pwsh
        env:
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WIN_CERT_BASE64))
          $st = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object { & $st sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WIN_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $_.FullName }
      - uses: actions/upload-artifact@v4
        with: { name: atrapacuentos-windows, path: target/release/bundle/nsis/*.exe }
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Paquetes del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libssl-dev mesa-vulkan-drivers xz-utils
      - name: Bajar FFmpeg y ONNX Runtime
        run: ./scripts/bajar-binarios.sh
      - name: Pruebas del núcleo (GPU wgpu, FFmpeg, relieve)
        run: |
          python -m pip install -q onnx numpy
          python scripts/modelo_prueba.py "$RUNNER_TEMP/prueba.onnx"
          export ATRAPA_FFMPEG="$PWD/src-tauri/bin/ffmpeg" ATRAPA_ORT_LIB="$PWD/src-tauri/bin/libonnxruntime.so" ATRAPA_MODELO_PRUEBA="$RUNNER_TEMP/prueba.onnx"
          cargo test -p atrapa-core -- --nocapture
      - name: Pruebas de interfaz (Chrome + Playwright, versión web)
        run: |
          python -m pip install -q playwright pillow
          CHROME="$(which google-chrome || which google-chrome-stable)" python pruebas/correr_ui.py
      - name: Instaladores
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: atrapacuentos-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
  # Al subir una etiqueta (por ejemplo v1.2.0) se publica una versión en GitHub con los instaladores:
  # de ahí los toma el aviso de actualizaciones de la aplicación.
  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: instaladores }
      - uses: softprops/action-gh-release@v2
        with:
          files: instaladores/**/*
          generate_release_notes: true
