# EXPERIMENTAL y solo manual (Actions → "macOS experimental" → Run workflow).
# No se ejecuta en cada subida y NO toca el flujo de Windows. Nadie ha probado todavía el resultado en un Mac real.
name: macOS experimental
on:
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: FFmpeg del sistema (sin codificación por GPU de Nvidia/AMD en Mac)
        run: |
          brew install ffmpeg
          mkdir -p src-tauri/bin && cp "$(which ffmpeg)" src-tauri/bin/ffmpeg
      - name: Comprobar que compila
        run: cargo check -p atrapa-core
      - name: Paquete .dmg
        run: npx --yes @tauri-apps/cli@2 build --bundles dmg
      - uses: actions/upload-artifact@v4
        with: { name: atrapacuentos-macos-experimental, path: target/release/bundle/dmg/*.dmg }
